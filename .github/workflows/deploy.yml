name: Deploy card to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 (LTS) bundles npm 11, which the lockfile is generated with.
          # Node 23 bundles npm 10.9.x, whose stricter peer resolution demands
          # packages the npm-11 lockfile does not contain (npm ci fails with
          # "Missing: typescript@7.0.2 from lock file"), and Node 23 is outside
          # the engines range of several dependencies.
          node-version: 24
          cache: npm
      - run: npm ci
      # Lint gate: ESLint (TS + Solid + a11y) + Stylelint + Prettier + tsc.
      - run: npm run lint
      # Component tests — vitest detects CI and runs once (no watch).
      - run: npm test
      # For a project site (https://<user>.github.io/<repo>/) the app must be
      # served under /<repo>/. For a user site or custom domain, leave "/".
      - run: npm run build
        env:
          BASE_URL: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
